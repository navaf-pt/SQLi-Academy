server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Cache-Control is set per location with `expires` so these headers stay
    # inherited (a nested add_header would silently drop them).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SQLite is shipped as WebAssembly. Some nginx mime maps are outdated, so the
    # type is forced here: without application/wasm the browser refuses to
    # instantiate the module via streaming compilation.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        expires 1y;
    }

    # Vite emits content-hashed filenames, so assets are safe to cache forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The HTML shell must always be revalidated, otherwise a new deploy keeps
    # pointing at purged asset hashes.
    location = /index.html {
        expires -1;
    }

    # Routes are hash fragments, so this fallback is only a safety net.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
